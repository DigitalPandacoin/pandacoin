stages:
  - base
  - build
  - upload
  - release

variables:
  GITIAN_DIR: /opt/gitian-builder
  # fixme: this uses a static version number
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pandacoin/0.9.0"

.build docker job:
  stage: base
  image: docker:stable
  variables:
    DOCKER_BUILDKIT: 1
    GIT_STRATEGY: none
  services:
    - docker:stable-dind
  tags:
    - docker
    - cpx51
  before_script:
    - echo $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
  after_script:
    - docker push $IMAGE:$CI_COMMIT_REF_SLUG
    - if [ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]; then docker push $IMAGE:latest; fi;

build gitian builder:
  extends: .build docker job
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/gitian/builder
  script:
    - |
      docker build --cache-from $IMAGE:$CI_COMMIT_REF_SLUG --tag $IMAGE:$CI_COMMIT_REF_SLUG --tag $IMAGE:latest --build-arg BUILDKIT_INLINE_CACHE=1 -<<EOF
        FROM docker:stable-dind
        RUN apk add curl make ruby wget git sed
        RUN git clone https://github.com/devrandom/gitian-builder.git ${GITIAN_DIR}
        RUN mkdir ${GITIAN_DIR}/inputs ${GITIAN_DIR}/var
        RUN wget -N -P ${GITIAN_DIR}/inputs https://github.com/phracker/MacOSX-SDKs/releases/download/10.15/MacOSX10.10.sdk.tar.xz
      EOF

trusty base image:
  extends: .build docker job
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/gitian/base-trusty-amd64
  script:
    - |
      docker build --cache-from $IMAGE:$CI_COMMIT_REF_SLUG --tag $IMAGE:$CI_COMMIT_REF_SLUG --tag $IMAGE:latest --build-arg BUILDKIT_INLINE_CACHE=1 -<<EOF
        FROM ubuntu:trusty
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update && apt-get --no-install-recommends -y install pciutils build-essential git subversion language-pack-en wget lsb-release
        RUN useradd -ms /bin/bash -U ubuntu
        USER ubuntu:ubuntu
        WORKDIR /home/ubuntu
        CMD ["sleep", "infinity"]
      EOF

warm extra worker:
  # in total we want three workers alive at the build stage
  # this should be removed in case we ever have three+ jobs in base stage
  stage: base
  tags:
    - docker
    - cpx51
  script:
    - echo "Warmup complete."

.build job:
  stage: build
  image: $CI_REGISTRY_IMAGE/gitian/builder:$CI_COMMIT_REF_SLUG
  services:
    - docker:stable-dind
  tags:
    - docker
    - cpx51
  cache:
    # PANDACOIN TODO bind major versions to cache, eg. CI_JOB_NAME + v0.9.0
    paths:
      - gitian-cache
    key: gitian-cache-${TARGET_ARCH}
  variables:
    GIT_DEPTH: 0
    DOCKER_BUILDKIT: 1
    USE_DOCKER: 1
    DEBIAN_FRONTEND: noninteractive
    IMAGE: $CI_REGISTRY_IMAGE/gitian/base-trusty-amd64
  before_script:
    - mv gitian-cache ${GITIAN_DIR}/cache || true
    - cd ${GITIAN_DIR}
    - echo $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker pull -q $IMAGE
    - docker tag $IMAGE base-trusty-amd64
  script:
    - make -j$(nproc) -C ${CI_PROJECT_DIR}/depends download SOURCES_PATH=${GITIAN_DIR}/cache/common
    - sed -i "s/^\ \ HOSTS=.*/\ \ HOSTS=\"${TARGET_ARCH}\"/g" ${CI_PROJECT_DIR}/contrib/gitian-descriptors/gitian-${TARGET_OS}.yml
    - ./bin/gbuild -j $(nproc) -m 30000 --commit pandacoin=${CI_COMMIT_TAG:-$CI_COMMIT_SHA} --url pandacoin=${CI_PROJECT_DIR} ${CI_PROJECT_DIR}/contrib/gitian-descriptors/gitian-${TARGET_OS}.yml
  after_script:
    - mv ${GITIAN_DIR}/cache ${CI_PROJECT_DIR}/gitian-cache
    - cp -r ${GITIAN_DIR}/build/out/* ${CI_PROJECT_DIR}/
  artifacts:
    name: "pandacoin-${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}"
    paths:
      - ${CI_PROJECT_DIR}/*.tar.gz
      - ${CI_PROJECT_DIR}/*.zip
      - ${CI_PROJECT_DIR}/*.exe
      - ${CI_PROJECT_DIR}/*.dmg
    expire_in: 1 week

intermediary:
  extends: .build job
  except:
    - tags
  # todo: check if this does what we need it to
  interruptible: true
  parallel:
    matrix:
      - TARGET_OS: win
        TARGET_ARCH: x86_64-w64-mingw32
      - TARGET_OS: osx
        TARGET_ARCH: x86_64-apple-darwin11
      - TARGET_OS: linux
        TARGET_ARCH: x86_64-linux-gnu
  artifacts:
    expire_in: 1 week

manual:
  extends: intermediary
  except:
    - tags
  when: manual
  parallel:
    matrix:
      - TARGET_OS: win
        TARGET_ARCH: i686-w64-mingw32
      - TARGET_OS: linux
        TARGET_ARCH: [i686-pc-linux-gnu, arm-linux-gnueabihf, aarch64-linux-gnu]

full:
  extends: .build job
  only:
    - tags
  parallel:
    matrix:
      - TARGET_OS: win
        TARGET_ARCH: [i686-w64-mingw32, x86_64-w64-mingw32]
      - TARGET_OS: osx
        TARGET_ARCH: [x86_64-apple-darwin11]
      - TARGET_OS: linux
        TARGET_ARCH: [i686-pc-linux-gnu, x86_64-linux-gnu, arm-linux-gnueabihf, aarch64-linux-gnu]

.generate bootstrap.dat job:
  stage: upload
  image: python:slim-buster
  rules:
    - if: '$BLOCKCOUNT'
  needs: ["intermediary: [linux, x86_64-linux-gnu]"]
  dependencies: ["intermediary: [linux, x86_64-linux-gnu]"]
  variables:
    GIT_DEPTH: 1
  script:
    - mkdir -p pandacoin
    - tar xzf pandacoin-*-x86_64-linux-gnu.tar.gz -C pandacoin --strip-components=1
    - export PATH=$PWD/pandacoin/bin:$PATH
    - mkdir $HOME/.pandacoin
    - |
      cat > $HOME/.pandacoin/pandacoin.conf <<EOF
      rpcuser=rpc
      rpcpassword=rpc
      daemon=1
      EOF
    - eval 'pandacoind ${ARGS}' &
    - |
      while [ ! -f $HOME/.pandacoin${NETDIR}/debug.log ]; do sleep .1; done
    - |
      while ! grep -q "UpdateTip" $HOME/.pandacoin${NETDIR}/debug.log; do sleep .1; done
    - |
      while [ "$(eval 'pandacoin-cli ${ARGS} getblockcount')" -lt "$BLOCKCOUNT" ]; do sleep 5; done
    - |
      cat > linearize.cfg <<EOF
      rpcuser = rpc
      rpcpassword = rpc
      datadir = $HOME/.pandacoin${NETDIR}
      host = 127.0.0.1
      port = $PORT
      max_height = $BLOCKCOUNT
      netmagic = $NETMAGIC
      genesis = $GENESIS_BLOCK
      input = $HOME/.pandacoin${NETDIR}/blocks
      output_file = $PWD/bootstrap.dat
      hashlist = hashlist.txt
      out_of_order_cache_sz = 100000000
      rev_hash_bytes = False
      file_timestamp = 0
      split_timestamp = 0
      debug_output = False
      EOF
    - python3 contrib/linearize/linearize-hashes.py linearize.cfg > hashlist.txt
    - python3 contrib/linearize/linearize-data.py linearize.cfg
  artifacts:
    name: "pandacoin-bootstrap-${NET}net-$BLOCKCOUNT-blocks"
    paths:
      - hashlist.txt
      - bootstrap.dat
    expire_in: 1 day

bootstrap.dat:
  extends: .generate bootstrap.dat job
  parallel:
    matrix:
      #- NET: main
      #  NETMAGIC: 8faefceb
      #  PORT: 22444
      #  GENESIS_BLOCK:
      - NET: test
        ARGS: -testnet
        NETDIR: /testnet3
        NETMAGIC: edebf0a8
        PORT: 33444
        GENESIS_BLOCK: 00000000e721ffd6d205ee59284685c918d155a3aba7fdc00af404f0d167f7a4

upload:
  stage: upload
  image: curlimages/curl:latest
  only:
    - tags
  variables:
    GIT_STRATEGY: none
  script:
    - |
      for i in *; do curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ${i} ${PACKAGE_REGISTRY_URL}/${i}; done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  # currently only upload is needed here. bootstrap or other artifacts might get added later
  needs: [upload]
  only:
    - tags
  variables:
    GIT_STRATEGY: none
  script:
    - |
      eval 'release-cli create --name "Release $CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG $(for i in *; do echo  --assets-link "{\"name\":\"${i}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${i}\"}"; done)'
