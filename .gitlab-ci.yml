stages:
  - base
  - build

variables:
  GITIAN_DIR: /opt/gitian-builder

.build docker job:
  stage: base
  image: docker:stable
  variables:
    DOCKER_BUILDKIT: 1
    GIT_STRATEGY: none
  services:
    - docker:stable-dind
  tags:
    - docker
    - cpx51
  before_script:
    - echo $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
  after_script:
    - docker push $IMAGE:$CI_COMMIT_REF_SLUG
    - if [ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]; then docker push $IMAGE:latest; fi;

build gitian builder:
  extends: .build docker job
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/gitian/builder
  script:
    - |
      docker build --cache-from $IMAGE:$CI_COMMIT_REF_SLUG --tag $IMAGE:$CI_COMMIT_REF_SLUG --tag $IMAGE:latest --build-arg BUILDKIT_INLINE_CACHE=1 -<<EOF
        FROM docker:stable-dind
        RUN apk add curl make ruby wget git sed
        RUN git clone https://github.com/devrandom/gitian-builder.git ${GITIAN_DIR}
        RUN mkdir ${GITIAN_DIR}/inputs ${GITIAN_DIR}/var
        RUN wget -N -P ${GITIAN_DIR}/inputs https://github.com/phracker/MacOSX-SDKs/releases/download/10.15/MacOSX10.10.sdk.tar.xz
      EOF

trusty base image:
  extends: .build docker job
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/gitian/base-trusty-amd64
  script:
    - |
      docker build --cache-from $IMAGE:$CI_COMMIT_REF_SLUG --tag $IMAGE:$CI_COMMIT_REF_SLUG --tag $IMAGE:latest --build-arg BUILDKIT_INLINE_CACHE=1 -<<EOF
        FROM ubuntu:trusty
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update && apt-get --no-install-recommends -y install pciutils build-essential git subversion language-pack-en wget lsb-release
        RUN useradd -ms /bin/bash -U ubuntu
        USER ubuntu:ubuntu
        WORKDIR /home/ubuntu
        CMD ["sleep", "infinity"]
      EOF

warm extra worker:
  # in total we want three workers alive at the build stage
  # this should be removed in case we ever have three+ jobs in base stage
  stage: base
  tags:
    - docker
    - cpx51
  script:
    - echo "Warmup complete."

.build job:
  stage: build
  image: $CI_REGISTRY_IMAGE/gitian/builder:$CI_COMMIT_REF_SLUG
  services:
    - docker:stable-dind
  tags:
    - docker
    - cpx51
  cache:
    # PANDACOIN TODO bind major versions to cache, eg. CI_JOB_NAME + v0.9.0
    paths:
      - gitian-cache
    key: gitian-cache-${TARGET_ARCH}
  variables:
    GIT_DEPTH: 0
    DOCKER_BUILDKIT: 1
    USE_DOCKER: 1
    DEBIAN_FRONTEND: noninteractive
    IMAGE: $CI_REGISTRY_IMAGE/gitian/base-trusty-amd64
  before_script:
    - mv gitian-cache ${GITIAN_DIR}/cache || true
    - cd ${GITIAN_DIR}
    - echo $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker pull -q $IMAGE
    - docker tag $IMAGE base-trusty-amd64
  script:
    - make -j$(nproc) -C ${CI_PROJECT_DIR}/depends download SOURCES_PATH=${GITIAN_DIR}/cache/common
    - sed -i "s/^\ \ HOSTS=.*/\ \ HOSTS=\"${TARGET_ARCH}\"/g" ${CI_PROJECT_DIR}/contrib/gitian-descriptors/gitian-${TARGET_OS}.yml
    - ./bin/gbuild -j $(nproc) -m 30000 --commit pandacoin=${CI_COMMIT_SHA} --url pandacoin=${CI_PROJECT_DIR} ${CI_PROJECT_DIR}/contrib/gitian-descriptors/gitian-${TARGET_OS}.yml
  after_script:
    - mv ${GITIAN_DIR}/cache ${CI_PROJECT_DIR}/gitian-cache
    - cp -r ${GITIAN_DIR}/build/out/* ${CI_PROJECT_DIR}/
  artifacts:
    name: "pandacoin-${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}"
    paths:
      - ${CI_PROJECT_DIR}/*.tar.gz
      - ${CI_PROJECT_DIR}/*.exe
      - ${CI_PROJECT_DIR}/*.dmg
    expire_in: 1 week

intermediary:
  extends: .build job
  except:
    - tags
  # todo: check if this does what we need it to
  interruptible: true
  parallel:
    matrix:
      - TARGET_OS: win
        TARGET_ARCH: x86_64-w64-mingw32
      - TARGET_OS: osx
        TARGET_ARCH: x86_64-apple-darwin11
      - TARGET_OS: linux
        TARGET_ARCH: x86_64-linux-gnu
  artifacts:
    expire_in: 1 week

manual:
  extends: intermediary
  except:
    - tags
  when: manual
  parallel:
    matrix:
      - TARGET_OS: win
        TARGET_ARCH: i686-w64-mingw32
      - TARGET_OS: linux
        TARGET_ARCH: [i686-pc-linux-gnu, arm-linux-gnueabihf, aarch64-linux-gnu]

full:
  extends: .build job
  only:
    - tags
  parallel:
    matrix:
      - TARGET_OS: win
        TARGET_ARCH: [i686-w64-mingw32, x86_64-w64-mingw32]
      - TARGET_OS: osx
        TARGET_ARCH: [x86_64-apple-darwin11]
      - TARGET_OS: linux
        TARGET_ARCH: [i686-pc-linux-gnu, x86_64-linux-gnu, arm-linux-gnueabihf, aarch64-linux-gnu]
  artifacts:
    expire_in: never
