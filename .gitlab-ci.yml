stages:
  - build
  - collect

variables:
  GITIAN_DIR: ${CI_PROJECT_DIR}/gitian-builder

.build job:
  stage: build
  image: ubuntu:focal
  services:
    - docker:stable-dind
  tags:
    - docker
  cache:
    # PANDACOIN TODO bind major versions to cache, eg. CI_JOB_NAME + v0.9.0
    paths:
      - gitian-cache
      - gitian-inputs
    key: ${CI_JOB_NAME}
  variables:
    USE_DOCKER: 1
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    - apt-get update
    - apt-get install -y docker-ce-cli make ruby wget git-core
    - git clone https://github.com/devrandom/gitian-builder.git gitian-builder
    - mv gitian-cache ${GITIAN_DIR}/cache || true
    - mv gitian-inputs ${GITIAN_DIR}/inputs || true
    - pushd ${GITIAN_DIR}
    - sed -i "/^RUN echo 'Acquire::http/d" bin/make-base-vm
    - bin/make-base-vm --suite trusty --arch amd64 --docker
    - mkdir -p inputs
    - wget -N -P inputs https://bitcoincore.org/cfields/osslsigncode-Backports-to-1.7.1.patch
    - wget -N -P inputs http://downloads.sourceforge.net/project/osslsigncode/osslsigncode/osslsigncode-1.7.1.tar.gz
    - if [ "${CI_JOB_NAME}" == "build osx" ]; then wget -N -P inputs https://github.com/phracker/MacOSX-SDKs/releases/download/10.15/MacOSX10.10.sdk.tar.xz; fi
  script:
    - make -j$(nproc) -C ${CI_PROJECT_DIR}/depends download SOURCES_PATH=$PWD/cache/common
    - ./bin/gbuild -j $(nproc) -m 6000 --commit pandacoin=${CI_COMMIT_SHA} --url pandacoin=https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git ${CI_PROJECT_DIR}/contrib/gitian-descriptors/${GITIAN_TARGET}
    - mv ${GITIAN_DIR}/cache ${CI_PROJECT_DIR}/gitian-cache
    - rm -rf ${GITIAN_DIR}/inputs/pandacoin
    - cp -r ${GITIAN_DIR}/inputs ${CI_PROJECT_DIR}/gitian-inputs
    - cp -r ${GITIAN_DIR}/build/out ${CI_PROJECT_DIR}/pandacoin-${CI_COMMIT_REF_SLUG}
  artifacts:
    name: "pandacoin-${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}"
    paths:
      - ${CI_PROJECT_DIR}/pandacoin-${CI_COMMIT_REF_SLUG}
    expire_in: 1 day

build linux:
  extends: .build job
  tags:
    - linux
  variables:
    GITIAN_TARGET: gitian-linux.yml

build win:
  extends: .build job
  tags:
    - win
  variables:
    GITIAN_TARGET: gitian-win.yml

build osx:
  extends: .build job
  tags:
    - osx
  variables:
    GITIAN_TARGET: gitian-osx.yml
